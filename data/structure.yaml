# data/structure.yaml — declarative tree for docs/. Every article slug appears exactly once.
#
# Source of the design: notes/helphub-structure-analysis.md §5 (target tree) and §6.
# Validated by /private/tmp/structure-work/check.py (0 missing, 0 duplicates, 0 unknown slugs).
#
# Schema (checked by scripts/convert.py --check-structure; README "Structure mode and before/after")
#   version: 1          remove_nav_links: bool          sections: [section, ...]
#   section keys:
#     slug      required; folder name (sanitize_title-clean, unique among siblings)
#     title     required unless `index` is set; with `intro` (Markdown) it becomes the generated README.md
#     index     article slug converted into the folder's README.md (its title/intro then win)
#     articles  ordered article slugs (order = menu order)
#     children  ordered sub-sections
#     classic    optional boolean (default false). `classic: true` marks classic-era content (Classic Editor,
#               classic themes). It is inherited by every descendant section and the articles in them, and
#               cannot be switched off below a classic section. Effects: article and generated README
#               frontmatter `classic: true`, manifest.json `"classic": true`, restructure-map `is_classic`.
#
# Technical guides: the old top-level "Technical guides" section (13 articles) is dissolved. Its articles
# are folded into Using WordPress as "Installation & hosting" and "Maintenance & security", except
# troubleshoot-login-issues (-> Users, roles & profiles) and search-engine-optimization
# (-> Writing & publishing > Organizing your site).
#
# Decisions
# ---------
# Block-first
#  - Principle: the main tree describes what a fresh WordPress install gives you today: the block editor, a
#    block theme and the Site Editor. Pages that only apply to the Classic Editor plugin, to classic themes
#    (widgets, Customizer, Menus screen) or to classic-era media shortcodes move to "Classic WordPress"
#    (classic-wordpress, classic: true), the last top-level section. classic-block and shortcode-block stay in
#    the Blocks reference because they are blocks.
#  - Classic WordPress > Classic Editor (11): first-steps-with-wordpress-classic (from Where to start),
#    write-posts-classic-editor, content-visibility-classic-editor, sticky-posts-classic-editor,
#    what-is-an-excerpt-classic-editor (from Writing & publishing), write-code-in-your-posts-classic-editor
#    (from Formatting & special characters), inserting-images-into-posts-and-pages-classic,
#    the-wordpress-gallery-classic-editor, audio-shortcode, video-shortcode (from Media) and
#    keyboard-shortcuts-classic-editor (from Block editor). Ordered as a workflow: first steps, write posts,
#    images, gallery, shortcodes, excerpt/visibility/sticky, code, keyboard shortcuts.
#  - Classic WordPress > Widgets, Menus and the Customizer (5): customizer, manage-wordpress-widgets,
#    block-based-widgets-editor, appearance-widgets-screen-classic-editor, appearance-menus-screen (all from
#    Administration screens > Appearance). Customizer first, then the widgets overview and the two Widgets
#    screens (block-based, then classic), then Menus. Block themes have none of these screens.
#  - Classic WordPress > Classic default themes (11 sections, 20 articles): Twenty Twenty-One back to Twenty Ten,
#    newest first, each with its existing index/changelog shape (Twenty Fourteen and Twenty Thirteen stay
#    changelog-only sections). Editing & design > Themes > Default themes keeps the four block themes
#    (Twenty Twenty-Five to Twenty Twenty-Two); its intro links to the classic section.
#  - appearance-theme-file-editor-screen stays in the main tree but moves from Administration screens >
#    Appearance to Administration screens > Tools (after the personal-data screens, before Network Setup):
#    with a block theme wp-admin shows the theme file editor under Tools > Theme File Editor.
#  - Administration screens > Appearance would be left holding only appearance-themes-screen, so the group is
#    removed (same rule as Comments) and appearance-themes-screen moves to Editing & design > Themes, after
#    work-with-themes. Appearance > Editor is the Site Editor section.
#  - Where to start, Writing & publishing, Formatting and Media no longer pair block/classic variants; their
#    intros point to Classic WordPress instead. Writing & publishing keeps 6 top-level articles (there is no
#    block editor "write posts" article; Block editor covers writing).
# Structure
#  - "Support guides" -> using-wordpress, "Customization" -> editing-and-design (titles per §5 sketch).
#  - "FAQs" is renamed "Frequently asked questions" (slug faq).
#  - Administration screens mirror the wp-admin menu. Comments would hold a single page (comments-screen),
#    so it lives in the Using WordPress > Comments topic section instead of its own screens group.
#  - Writing & publishing (25 articles in HelpHub) is split: core writing tasks stay at its top level;
#    "Organizing your site" (post types, taxonomies, custom fields, permalinks, front page, search page,
#    date format, SEO) and "Formatting & special characters" become children.
#  - "Comments" is a new Using WordPress section built from Publishing articles plus comments-screen.
#  - "Users, roles & profiles" is a new section (roles-and-capabilities, use-gravatars, reset-your-password,
#    troubleshoot-login-issues). The three Users *screens* stay in Administration screens > Users.
#  - Block editor settings overviews get their own "Block settings" child under "Working with blocks"
#    (depth 4) rather than one flat 20-item list.
#  - The Embeds blocks section uses the `embeds` article as its index; `embed-block` (the generic block)
#    is listed first, then the provider embeds alphabetically.
#  - Block reference lists are alphabetical by title (not slug), with "(Deprecated)"/"(Removed)" pages last.
#    Note verse-block sorts as "Poetry block".
#  - Site editor uses the `site-editor` article as its index, which removes the section/article slug clash.
#  - Default themes: 13 themes have both an article and a changelog (4 block themes in Default themes, 9 classic in
#    Classic WordPress > Classic default themes). Twenty Fourteen and Twenty Thirteen have
#    only a changelog (no theme article exists), so they get generated sections with a short intro holding
#    just the changelog, keeping the newest-first sequence unbroken. There is no Twenty Eighteen theme.
# Placements worth a second look
#  - wordpress-block-editor: Dashboard -> Block editor (first article, acts as the editor overview).
#  - video-shortcode: Dashboard -> Classic WordPress > Classic Editor, next to audio-shortcode.
#  - what-is-post-type: Dashboard -> Writing & publishing > Organizing your site.
#  - site-editor, additional-guide-to-using-the-site-editor: Appearance -> Site editor.
#  - template-editor: Block editor -> Site editor (it edits templates, a site-level concept).
#  - introduction-to-plugins, manage-plugins: Appearance -> Administration screens > Plugins, ahead of the
#    two Plugins screens.
#  - block-based-widgets-editor, manage-wordpress-widgets: kept with appearance-widgets-screen-classic-editor in
#    Classic WordPress > Widgets, Menus and the Customizer (wp-admin Appearance > Widgets only exists with a
#    classic theme), not with the Widget blocks reference.
#  - customizer: Classic WordPress > Widgets, Menus and the Customizer (Appearance > Customize is a classic-theme
#    screen).
#  - layout-settings-overview, position-settings-overview: Appearance -> Block settings.
#  - styles-overview, the-font-library: Appearance -> Site editor.
#  - use-gravatars: Appearance -> Users, roles & profiles.
#  - assign-custom-fields: Appearance -> Writing & publishing > Organizing your site.
#  - create-a-favicon: Appearance -> Themes (top level, next to work-with-themes). Debatable: it now lives in
#    Settings > General, so settings-general-screen's neighbourhood is an alternative.
#  - Uncategorized: responsive-styles -> Block settings; site-editor-identity -> Site editor.
#  - keyboard-shortcuts-block-editor: Dashboard -> Block editor top level. Its Classic Editor counterpart is in
#    Classic WordPress > Classic Editor (block-first rule; the pair is no longer adjacent).
#  - distraction-free-mode: Dashboard -> Block editor.
#  - administration-screens, toolbar: top of Administration screens (overview pages for the whole group).
#  - search-engine-optimization: Technical guides > Installation -> Organizing your site.
#  - block-directory, block-error-unexpected-or-invalid-content, page-jumps: Working with blocks.
version: 1
remove_nav_links: true
sections:
  # ------------------------------------------------------------------------------------------------
  - slug: overview
    title: WordPress overview
    intro: |
      Learn what WordPress is, where it came from, and how to take your first steps with it.

      Start with **Where to start** if you are new to WordPress: it is a short reading path from setting
      up your site to understanding the vocabulary used throughout this documentation. **About WordPress**
      covers the project's history, versions and community, and **Frequently asked questions** answers the
      questions people ask most often.
    articles: []
    children:
      - slug: where-to-start
        title: Where to start
        intro: |
          New to WordPress? Read these pages in order. They take you from getting a site running, through
          your first steps in the editor, to the terms and concepts you will meet everywhere else in the
          documentation.

          The first-steps guide covers the block editor, the default since WordPress 5.0. If your site uses
          the Classic Editor plugin, its version of the guide is in **Classic WordPress**.
        articles:
          - get-started-with-wordpress
          - first-steps-with-wordpress-block-editor
          - where-to-find-wordpress-help
          - wordpress-glossary
          - wordpress-semantics
          - introduction-to-blogging
      - slug: about-wordpress
        title: About WordPress
        intro: |
          Background on the WordPress project: its origins, how WordPress.org differs from WordPress.com,
          the history of every release, which versions are still supported, and how you can contribute.
        articles:
          - learn-about-wordpress-and-version-history
          - difference-between-wordpress-org-and-wordpress-com
          - wordpress-versions
          - wordpress-versions-0-7-to-4-9
          - supported-versions
          - become-a-wordpress-contributor
      - slug: faq
        title: Frequently asked questions
        intro: |
          Quick answers to common questions about working with WordPress, installing it, and fixing
          problems, including what to do when your changes don't appear or your site has been hacked.
        articles:
          - faq-work-with-wordpress
          - faq-installation
          - faq-troubleshooting
          - faq-i-make-changes-and-nothing-happens
          - faq-my-site-was-hacked

  # ------------------------------------------------------------------------------------------------
  - slug: using-wordpress
    title: Using WordPress
    intro: |
      Everything you need to run a WordPress site day to day: the administration screens, writing and
      publishing content, managing media and comments, working with users, and keeping your site installed,
      updated and secure.

      If you are looking for a specific screen in your dashboard, go to **Administration screens**, which
      follows the order of the wp-admin menu. For tasks, start with **Writing & publishing**.
    articles: []
    children:
      - slug: administration-screens
        index: administration-screens
        articles:
          - toolbar
        children:
          - slug: dashboard
            title: Dashboard
            intro: |
              The Dashboard menu: the screen you see when you log in, with an at-a-glance view of your site,
              and the Updates screen where you install updates to WordPress, plugins, themes and translations.
            articles:
              - dashboard-screen
              - dashboard-updates-screen
          - slug: posts
            title: Posts
            intro: |
              The Posts menu: the list of all your posts, and the screens for managing the categories and
              tags you use to organise them.
            articles:
              - posts-screen
              - posts-categories-screen
              - posts-tags-screen
          - slug: media-screens
            title: Media
            intro: |
              The Media menu: the Media Library, where you browse and manage uploaded files, and the Add New
              screen for uploading them.
            articles:
              - media-library-screen
              - media-add-new-screen
          - slug: pages
            title: Pages
            intro: |
              The Pages menu: the list of all your pages, and the screen for creating a new one.
            articles:
              - pages-screen
              - pages-add-new-screen
          - slug: plugins
            title: Plugins
            intro: |
              Plugins add features to your WordPress site. These pages explain what plugins are, how to
              install, activate, update and remove them, and what you can do on the Plugins and Add New
              Plugin screens.
            articles:
              - introduction-to-plugins
              - manage-plugins
              - plugins-screen
              - plugins-add-new-screen
          - slug: users
            title: Users
            intro: |
              The Users menu: the list of everyone with an account on your site, the screen for adding new
              users, and your own profile. For roles, passwords and avatars, see
              **Users, roles & profiles**.
            articles:
              - users-screen
              - users-add-new-screen
              - users-your-profile-screen
          - slug: tools
            title: Tools
            intro: |
              The Tools menu: importing and exporting content, checking your site's health, handling
              personal data requests, editing theme files, and setting up a multisite network.

              With a block theme the Theme File Editor is listed here (Tools > Theme File Editor); classic
              themes show it under Appearance.
            articles:
              - tools-screen
              - tools-import-screen
              - tools-export-screen
              - site-health-screen
              - tools-export-personal-data-screen
              - tools-erase-personal-data-screen
              - appearance-theme-file-editor-screen
              - tools-network-screen
          - slug: settings
            title: Settings
            intro: |
              The Settings menu: site-wide options for your title and language, writing and reading
              defaults, discussion and comments, media sizes, permalinks, privacy, and connections to
              external services.
            articles:
              - settings-general-screen
              - settings-writing-screen
              - settings-reading-screen
              - settings-discussion-screen
              - settings-media-screen
              - settings-permalinks-screen
              - settings-privacy-screen
              - settings-connectors-screen

      - slug: writing-and-publishing
        title: Writing & publishing
        intro: |
          How to create and publish content in WordPress: writing posts and pages, controlling who can see
          them and when, using excerpts and revisions, and organising your site so visitors can find things.

          These pages describe the block editor. For the editor itself, see **Block editor** under
          **Editing & design**; Classic Editor versions of these tasks are in **Classic WordPress**.
        articles:
          - create-pages
          - post-status
          - content-visibility-block-editor
          - protect-posts-with-password
          - what-is-an-excerpt-block-editor
          - revisions
        children:
          - slug: organizing-your-site
            title: Organizing your site
            intro: |
              How WordPress structures content and URLs: post types, categories and tags, custom fields,
              permalinks, and the special pages such as a static front page or a search page. It also
              covers how WordPress helps search engines find your content.
            articles:
              - what-is-post-type
              - taxonomies
              - assign-custom-fields
              - customize-permalinks
              - create-a-static-front-page
              - create-a-search-page
              - customize-date-and-time-format
              - search-engine-optimization
          - slug: formatting
            title: Formatting & special characters
            intro: |
              Details of how WordPress handles the text you type: character entities, emoji and smilies,
              and the filters WordPress applies to post content before it is displayed.
            articles:
              - use-character-entities
              - what-are-emoji
              - what-are-smilies
              - how-wordpress-processes-post-content

      - slug: media
        title: Media
        intro: |
          Working with images, galleries, audio, video and other files: inserting them into posts and pages,
          editing them, and choosing the right size and quality.

          These pages describe the block editor. The Classic Editor versions, and the audio and video
          shortcodes, are in **Classic WordPress**.
        articles:
          - use-images
          - inserting-images-into-posts-and-pages-block-editor
          - the-wordpress-gallery-block-editor
          - edit-media
          - image-size-and-quality
          - use-image-and-file-attachments

      - slug: comments
        title: Comments
        intro: |
          Comments let visitors respond to your content. These pages explain how comments work, how to
          moderate them and deal with spam, what trackbacks and pingbacks are, and how to use the Comments
          screen in your dashboard.
        articles:
          - comments-in-wordpress
          - comment-moderation
          - understand-comment-spam
          - trackbacks-and-pingbacks
          - comments-screen

      - slug: users-roles-and-profiles
        title: Users, roles & profiles
        intro: |
          Who can do what on your site. Learn about user roles and capabilities, set up your Gravatar
          profile picture, reset a lost password, and fix problems logging in.
        articles:
          - roles-and-capabilities
          - use-gravatars
          - reset-your-password
          - troubleshoot-login-issues

      - slug: installation-and-hosting
        title: Installation & hosting
        intro: |
          Getting WordPress onto a server: what to look for in a hosting provider and how to install
          WordPress using the one-click installers many hosts provide.

          Detailed and manual installation guides are on developer.wordpress.org.
        articles:
          - hosting-wordpress
          - use-automated-installation

      - slug: maintenance-and-security
        title: Maintenance & security
        intro: |
          Keeping a WordPress site healthy and safe: routine administration and housekeeping, updating
          WordPress, plugins and themes, recovering from fatal errors, and protecting your site and your
          visitors' privacy.
        articles:
          - administer-your-blog
          - wordpress-housekeeping
          - wordpress-site-maintenance
          - updating-wordpress
          - plugins-themes-auto-updates
          - recovery-mode
          - password-best-practices
          - why-should-i-use-https
          - wordpress-privacy

  # ------------------------------------------------------------------------------------------------
  - slug: editing-and-design
    title: Editing & design
    intro: |
      Get the look and feel you want on your site. This section covers the block editor and every core
      block, the Site Editor for designing templates and global styles, and themes, including the default
      themes that ship with WordPress.
    articles: []
    children:
      - slug: block-editor
        title: Block editor
        intro: |
          The block editor is where you write and design posts and pages. Every piece of content, from a
          paragraph to an image gallery, is a block.

          Start with the overview of the editor and its interface. **Working with blocks** explains the
          tools shared by all blocks, such as adding and moving blocks and the settings in the sidebar.
          **Patterns** covers ready-made groups of blocks, and **Blocks** is a reference for every core
          block.
        articles:
          - wordpress-block-editor
          - page-post-settings-sidebar
          - preferences-overview
          - how-to-use-the-preview-function
          - distraction-free-mode
          - keyboard-shortcuts-block-editor
          - notes
        children:
          - slug: working-with-blocks
            title: Working with blocks
            intro: |
              The tools and concepts shared by every block: adding blocks, moving them around, using List
              View and the More options menu, editing links and rich text, and finding new blocks in the
              Block Directory.

              The individual block pages refer back to these pages rather than repeating them, so it is
              worth reading them once before you look up a specific block.
            articles:
              - work-with-blocks
              - adding-a-new-block
              - moving-blocks
              - list-view
              - more-options
              - link-editing
              - more-text-editing-overview
              - page-jumps
              - block-directory
              - block-error-unexpected-or-invalid-content
            children:
              - slug: block-settings
                title: Block settings
                intro: |
                  Most blocks share the same groups of settings in the block sidebar: layout, position,
                  color, background, typography, dimensions, border and shadow, filters, and advanced
                  options. Each page here explains one group, in the order they appear in the sidebar.

                  In block themes you can also set some of these differently for each screen size; see
                  responsive styles.
                articles:
                  - layout-settings-overview
                  - position-settings-overview
                  - colors-settings-overview
                  - background-settings-overview
                  - typography-settings-overview
                  - dimension-controls-overview
                  - border-settings-overview
                  - filters-settings-overview
                  - advanced-settings-overview
                  - responsive-styles
          - slug: patterns
            title: Patterns
            intro: |
              Patterns are ready-made collections of blocks you can insert and customise. Synced patterns
              (formerly reusable blocks) update everywhere they are used when you edit them.

              Learn how to use patterns, find more in the Pattern Directory, submit your own, and how
              patterns differ from template parts.
            articles:
              - block-pattern
              - reusable-blocks
              - comparing-patterns-template-parts-and-reusable-blocks
              - block-pattern-directory
              - submit-your-block-pattern-to-the-directory
          - slug: blocks
            index: blocks-list
            articles: []
            children:
              - slug: text
                title: Text blocks
                intro: |
                  Blocks for written content: paragraphs, headings, lists, quotes, tables, code and more.
                articles:

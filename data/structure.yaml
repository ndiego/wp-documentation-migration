  # ------------------------------------------------------------------------------------------------
  # Classic WordPress (classic: true, inherited): classic themes and the Classic Editor plugin. Keep last.
  - slug: classic-wordpress
    title: Classic WordPress
    classic: true
    intro: |
      These pages cover features you only see on a site that uses a classic theme or the Classic Editor
      plugin: the Classic Editor itself and the audio and video shortcodes, the widgets, menus and Customizer
      screens of classic themes, and the classic default themes.

      A fresh WordPress install ships with a block theme and the block editor, so you may never see these
      screens. For the block-first equivalents (the block editor, the Site Editor and block themes), see
      [Editing & design](../editing-and-design/README.md).
    articles: []
    children:
      - slug: classic-editor
        title: Classic Editor
        intro: |
          The Classic Editor plugin brings back the editor WordPress used before version 5.0. These pages
          follow a typical workflow: first steps, writing a post, adding images and galleries, embedding
          audio and video with shortcodes, excerpts, visibility and sticky posts, showing code, and
          keyboard shortcuts.

          For the default editor, see [Block editor](../../editing-and-design/block-editor/README.md).
        articles:
          - first-steps-with-wordpress-classic
          - write-posts-classic-editor
          - inserting-images-into-posts-and-pages-classic
          - the-wordpress-gallery-classic-editor
          - audio-shortcode
          - video-shortcode
          - what-is-an-excerpt-classic-editor
          - content-visibility-classic-editor
          - sticky-posts-classic-editor
          - write-code-in-your-posts-classic-editor
          - keyboard-shortcuts-classic-editor
      - slug: widgets-menus-and-customizer
        title: Widgets, Menus and the Customizer
        intro: |
          Classic themes are customised in the Customizer (Appearance > Customize) and on the Widgets and
          Menus screens. Block themes replace all three with the Site Editor (Appearance > Editor), where
          widget areas become template parts and menus become Navigation blocks; see
          [Site Editor](../../editing-and-design/site-editor/README.md).
        articles:
          - customizer
          - manage-wordpress-widgets
          - block-based-widgets-editor
          - appearance-widgets-screen-classic-editor
          - appearance-menus-screen
      - slug: classic-default-themes
        title: Classic default themes
        intro: |
          The default themes WordPress shipped before Twenty Twenty-Two, newest first. They are classic
          themes: you customise them with the Customizer, widgets and menus rather than in the Site Editor.
          They still receive security and compatibility updates, so they remain available to install from
          the theme directory.

          For the default block themes, see
          [Default themes](../../editing-and-design/themes/default-themes/README.md).
        articles: []
